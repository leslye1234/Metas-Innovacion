<title>Panel de Ranking en Vivo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  /* Layout: una sola pantalla de solo lectura (ranking en vivo); al completarse la votación se habilita el modo de edición por consenso. */
  :root {
    color-scheme: light;
    --bg: #ffffff; --surface: #ffffff; --ink: #0f2a3d; --muted: #55707f; --line: #bfe3ec;
    --brand: #0b6e99; --brand-strong: #07556f; --brand-ink: #ffffff; --soft: #e8f7fa; --turq: #32c5db;
    --win: #1fa463; --win-bg: #e1f5ea; --win-ink: #0c5a34; --rest-bar: #a9c4d8;
    --boost: #e0a800; --boost-bg: #fff3bf; --boost-ink: #6b4e00;
    --font-display: "Outfit", "Segoe UI", system-ui, sans-serif;
    --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
  h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  .wrap { width: 100%; max-width: 860px; margin: 0 auto; }

  .top { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; }
  .eyebrow { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--brand-strong); margin-bottom: 6px; }
  .top h1 { font-size: 26px; color: #04252f; }
  .status { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 13px; background: var(--soft); color: var(--brand-strong); }
  .status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--win); animation: pulse 1.4s infinite; }
  .status.done { background: var(--win-bg); color: var(--win-ink); }
  .status.done .dot { animation: none; }
  .status.edit { background: var(--boost-bg); color: var(--boost-ink); }
  .status.edit .dot { background: var(--boost); animation: none; }
  @keyframes pulse { 50% { opacity: .35; } }

  .card { background: var(--surface); border: 3px solid var(--brand); border-radius: 14px; box-shadow: 0 4px 14px rgba(11,110,153,.15); padding: 16px 18px; }
  .ph { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: baseline; margin-bottom: 10px; }
  .ph h2 { font-size: 16px; }
  .ph .num { font-family: var(--font-display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
  .track { height: 12px; background: var(--soft); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--brand); border-radius: 999px; transition: width .6s ease; }
  .fill.done { background: var(--win); }
  .feed { margin-top: 10px; color: var(--muted); font-size: 13px; min-height: 20px; }
  .feed .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--win); margin-right: 8px; }

  .actions { margin: 16px 0 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .actions .msg { flex: 1; min-width: 220px; color: var(--muted); font-size: 14px; }
  .actions .msg strong { color: var(--ink); }
  .btn { display: inline-flex; align-items: center; justify-content: center; padding: 11px 20px; border: 0; border-radius: 10px; background: var(--brand); color: var(--brand-ink); font-weight: 700; cursor: pointer; transition: background .15s; }
  .btn:hover:not(:disabled) { background: var(--brand-strong); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--brand-strong); border: 1.5px solid var(--line); padding: 9px 16px; font-weight: 600; }
  .btn.ghost:hover:not(:disabled) { background: var(--soft); }
  .btn.ok { background: var(--win); }
  .btn.ok:hover:not(:disabled) { background: #178650; }

  .rkstat { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; } .rkstat span { background: var(--soft); color: var(--brand-strong); font-weight: 700; font-size: 13px; padding: 5px 12px; border-radius: 999px; font-variant-numeric: tabular-nums; } .rkstat span.hi { background: var(--win-bg); color: var(--win-ink); }
  .pts { width: 66px !important; } .pts small.avg { white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: #07323f; margin: 6px 0 10px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }

  .rank { position: relative; user-select: none; }
  .rrow { position: absolute; left: 0; right: 0; height: 66px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 14px; border-radius: 12px;
    background: var(--surface); border: 1.5px solid var(--line); border-left: 6px solid var(--rest-bar); transition: transform .7s cubic-bezier(.3,.8,.3,1), background .4s, border-color .4s; }
  .rrow.win { background: var(--win-bg); border-color: var(--win); border-left-color: var(--win); }
  .rrow.boost { background: var(--boost-bg); border-color: var(--boost); border-left-color: var(--boost); }
  .rrow.dragging { transition: none; z-index: 999 !important; box-shadow: 0 10px 26px rgba(4,37,47,.28); opacity: .97; }
  .pos { width: 30px; flex: none; font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rrow.win .pos { color: var(--win-ink); } .rrow.boost .pos { color: var(--boost-ink); }
  .name { flex: 1; min-width: 0; font-size: 14px; line-height: 1.25; cursor: help; }
  .rrow.win .name { font-weight: 600; color: var(--win-ink); } .rrow.boost .name { font-weight: 600; color: var(--boost-ink); }
  .area { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--brand-strong); margin-bottom: 1px; }
  .rrow.win .area { color: var(--win-ink); opacity: .8; } .rrow.boost .area { color: var(--boost-ink); opacity: .85; }
  .mv { font-style: normal; letter-spacing: 0; text-transform: none; margin-left: 8px; font-size: 11px; font-weight: 700; }
  .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meter { flex: none; width: min(22%, 130px); height: 8px; background: color-mix(in srgb, var(--rest-bar) 35%, transparent); border-radius: 999px; overflow: hidden; }
  .meter span { display: block; height: 100%; width: 0; background: var(--rest-bar); border-radius: 999px; transition: width .6s ease; }
  .rrow.win .meter span { background: var(--win); } .rrow.boost .meter span { background: var(--boost); }
  .pts { flex: none; width: 52px; text-align: right; font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
  .pts small { font-family: var(--font-body); font-weight: 500; font-size: 11px; color: var(--muted); display: block; margin-top: -3px; }
  .rrow.win .pts { color: var(--win-ink); } .rrow.boost .pts { color: var(--boost-ink); }

  .ctl { display: none; flex: none; align-items: center; gap: 4px; }
  .rank.editing .ctl { display: flex; }
  .ctl .grip { width: 30px; height: 30px; display: grid; place-items: center; color: var(--brand); touch-action: none; font-size: 18px; letter-spacing: -2px; }
  .rank.editing .rrow { border-style: dashed; cursor: grab; touch-action: pan-y; }
  .rank.editing .rrow .grip { touch-action: none; }
  .rank.editing .rrow:hover:not(.dragging) { box-shadow: 0 3px 12px rgba(11,110,153,.22); }
  .rrow.dragging { cursor: grabbing !important; }

  .footer-logo { display: flex; justify-content: center; margin-top: 36px; }
  .footer-logo img { width: 150px; height: auto; }
  .demo { margin-top: 22px; padding: 12px 14px; border: 1.5px dashed var(--line); border-radius: 12px; color: #07323f; font-size: 13px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .demo .btns { display: flex; gap: 8px; flex-wrap: wrap; }

  #tip { position: fixed; z-index: 1000; width: min(360px, calc(100vw - 24px)); background: var(--surface); border: 2px solid var(--brand); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(4,37,47,.25); padding: 14px 16px; pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
  #tip.show { opacity: 1; transform: none; }
  #tip .tarea { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--brand-strong); }
  #tip h3 { font-size: 16px; line-height: 1.25; margin: 2px 0 10px; }
  #tip dl { margin: 0; display: grid; gap: 9px; }
  #tip dt { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  #tip dd { margin: 1px 0 0; font-size: 13.5px; line-height: 1.4; }
  #tip .ej { margin-top: 10px; font-size: 11px; color: var(--muted); }

  @media (max-width: 560px) { .meter { display: none; } .top h1 { font-size: 21px; } .rrow { padding-right: 8px; gap: 8px; } .pts { width: 44px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow">Sesión de Estrategia</div>
      <h1>Ranking en vivo de dolores</h1>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="statusTxt">En vivo</span></div>
  </div>

  <div class="card" aria-live="polite">
    <div class="ph">
      <h2>Participación completada</h2>
      <div class="num"><span id="pDone">0</span> de <span id="pTotal">30</span> · <span id="pPct">0%</span></div>
    </div>
    <div class="track" role="progressbar" aria-label="Participación" aria-valuemin="0" aria-valuemax="100" id="pTrack"><div class="fill" id="pFill"></div></div>
    <div class="feed" id="feed"></div>
  </div>

  <div class="actions" id="actions">
    <div class="msg" id="msg"></div>
    <button class="btn" id="btnEdit" hidden>Modificar ranking</button>
    <button class="btn ok" id="btnSave" hidden>Guardar orden final</button>
    <button class="btn ghost" id="btnResetOrder" hidden>Volver al orden por votos</button>
    <button class="btn ghost" id="btnCancel" hidden>Cancelar</button>
  </div>

  <div class="rkstat" id="rkStat"></div>
  <div class="legend">
    <span><i style="background:var(--win)"></i>Top 8 por puntaje</span>
    <span><i style="background:var(--boost)"></i>Subió por consenso</span>
    <span><i style="background:var(--rest-bar)"></i>Resto de dolores</span>
  </div>
  <div class="rank" id="rank"></div>

  <div class="demo">
    <span>Vista previa: los participantes y sus votos son simulados. En la plataforma real llegan de la sesión.</span>
    <span class="btns">
      <button class="btn ghost" id="btnFast">Completar votación ya</button>
      <button class="btn ghost" id="btnReset">Reiniciar simulación</button>
    </span>
  </div>
